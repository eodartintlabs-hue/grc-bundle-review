<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" width="100%" height="100%">
  <defs>
    <!-- Soft Card Drop Shadow -->
    <filter id="cardShadow" x="-8%" y="-8%" width="116%" height="124%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.08"/>
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.05"/>
    </filter>

    <!-- Core Bar Drop Shadow -->
    <filter id="barShadow" x="-4%" y="-10%" width="108%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1e3a8a" flood-opacity="0.18"/>
    </filter>

    <!-- Core Application Horizontal Gradient (Green -> Cyan -> Royal -> Purple) -->
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="32%" stop-color="#14b8a6"/>
      <stop offset="68%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>

    <!-- Arrow Markers -->
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#00a8e8"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#0066cc"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#f97316"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#10b981"/>
    </marker>
    <marker id="arrowSlate" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#334155"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="740" rx="12" fill="#ffffff"/>

  <!-- ===================================================================== -->
  <!-- HEADER: TECHNOLOGY STACK                                              -->
  <!-- ===================================================================== -->
  <rect x="75" y="42" width="110" height="5" rx="2.5" fill="#00a8e8"/>
  <text x="75" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="36" font-weight="800" fill="#4b5563" letter-spacing="0.5">
    TECHNOLOGY <tspan fill="#00a8e8">STACK</tspan>
  </text>

  <!-- ===================================================================== -->
  <!-- TOP ROW: CONTAINERIZED SECURITY ENGINES & POLICY BASELINES            -->
  <!-- ===================================================================== -->
  <rect x="75" y="120" width="1050" height="128" rx="18" fill="#f3f4f6" stroke="#c5c9d0" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Card 1: Semgrep & Gitleaks (SAST + Secrets) -->
  <g transform="translate(95, 140)">
    <rect width="235" height="88" rx="12" fill="#ffffff" filter="url(#cardShadow)"/>
    <circle cx="44" cy="44" r="26" fill="#00a8e8"/>
    <!-- Shield + Code Icon -->
    <path d="M44 26 L58 32 V43 C58 52 52 58 44 62 C36 58 30 52 30 43 V32 Z" fill="none" stroke="#ffffff" stroke-width="2"/>
    <path d="M41 40 L37 44 L41 48 M47 40 L51 44 L47 48" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="82" y="39" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#374151">SAST &amp; Secrets</text>
    <text x="82" y="57" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" fill="#6b7280">Semgrep • Gitleaks</text>
    <text x="82" y="73" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="600" fill="#00a8e8">37 AOC AST Rules</text>
  </g>

  <!-- Card 2: Checkov & Cloud IaC -->
  <g transform="translate(352, 140)">
    <rect width="235" height="88" rx="12" fill="#ffffff" filter="url(#cardShadow)"/>
    <circle cx="44" cy="44" r="26" fill="#00a8e8"/>
    <!-- Cloud / IaC Search Icon -->
    <rect x="31" y="31" width="26" height="22" rx="3" fill="none" stroke="#ffffff" stroke-width="2"/>
    <line x1="31" y1="37" x2="57" y2="37" stroke="#ffffff" stroke-width="2"/>
    <circle cx="46" cy="45" r="4" fill="none" stroke="#ffffff" stroke-width="2"/>
    <line x1="49" y1="48" x2="53" y2="52" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <text x="82" y="39" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#374151">IaC &amp; Cloud</text>
    <text x="82" y="57" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" fill="#6b7280">Checkov • Terraform</text>
    <text x="82" y="73" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="600" fill="#00a8e8">AMI EBS Cold-Mount</text>
  </g>

  <!-- Card 3: SBOM & CVE Scanners -->
  <g transform="translate(610, 140)">
    <rect width="235" height="88" rx="12" fill="#ffffff" filter="url(#cardShadow)"/>
    <circle cx="44" cy="44" r="26" fill="#00a8e8"/>
    <!-- SBOM Layers / Bars Icon -->
    <path d="M32 52 H56 M35 52 V40 M41 52 V34 M47 52 V38 M53 52 V31" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <ellipse cx="44" cy="52" rx="14" ry="4" fill="none" stroke="#ffffff" stroke-width="1.8"/>
    <text x="82" y="39" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#374151">SBOM &amp; CVE</text>
    <text x="82" y="57" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" fill="#6b7280">Syft • Grype • Trivy</text>
    <text x="82" y="73" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="600" fill="#00a8e8">CycloneDX &amp; SPDX</text>
  </g>

  <!-- Card 4: STIG & Crypto Engine -->
  <g transform="translate(868, 140)">
    <rect width="235" height="88" rx="12" fill="#ffffff" filter="url(#cardShadow)"/>
    <circle cx="44" cy="44" r="26" fill="#00a8e8"/>
    <!-- Crypto Lock & Nodes Icon -->
    <rect x="37" y="42" width="14" height="12" rx="2" fill="none" stroke="#ffffff" stroke-width="2"/>
    <path d="M40 42 V37 C40 34.5 48 34.5 48 37 V42" fill="none" stroke="#ffffff" stroke-width="2"/>
    <circle cx="32" cy="34" r="2" fill="#ffffff"/>
    <circle cx="56" cy="34" r="2" fill="#ffffff"/>
    <circle cx="32" cy="52" r="2" fill="#ffffff"/>
    <circle cx="56" cy="52" r="2" fill="#ffffff"/>
    <text x="82" y="39" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#374151">STIG &amp; Crypto</text>
    <text x="82" y="57" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" fill="#6b7280">OpenSCAP • FIPS 140</text>
    <text x="82" y="73" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="600" fill="#00a8e8">DISA STIG &amp; EOL</text>
  </g>

  <!-- ===================================================================== -->
  <!-- TOP BIDIRECTIONAL ARROWS (SCANNERS <-> CORE APPLICATION)              -->
  <!-- ===================================================================== -->
  <!-- Pair 1 -->
  <line x1="204" y1="248" x2="204" y2="288" stroke="#00a8e8" stroke-width="2.5" stroke-dasharray="6,3" marker-end="url(#arrowCyan)"/>
  <line x1="220" y1="294" x2="220" y2="254" stroke="#0066cc" stroke-width="2.5" stroke-dasharray="6,3" marker-end="url(#arrowBlue)"/>

  <!-- Pair 2 -->
  <line x1="462" y1="248" x2="462" y2="288" stroke="#00a8e8" stroke-width="2.5" stroke-dasharray="6,3" marker-end="url(#arrowCyan)"/>
  <line x1="478" y1="294" x2="478" y2="254" stroke="#0066cc" stroke-width="2.5" stroke-dasharray="6,3" marker-end="url(#arrowBlue)"/>

  <!-- Pair 3 -->
  <line x1="720" y1="248" x2="720" y2="288" stroke="#00a8e8" stroke-width="2.5" stroke-dasharray="6,3" marker-end="url(#arrowCyan)"/>
  <line x1="736" y1="294" x2="736" y2="254" stroke="#0066cc" stroke-width="2.5" stroke-dasharray="6,3" marker-end="url(#arrowBlue)"/>

  <!-- Pair 4 -->
  <line x1="978" y1="248" x2="978" y2="288" stroke="#00a8e8" stroke-width="2.5" stroke-dasharray="6,3" marker-end="url(#arrowCyan)"/>
  <line x1="994" y1="294" x2="994" y2="254" stroke="#0066cc" stroke-width="2.5" stroke-dasharray="6,3" marker-end="url(#arrowBlue)"/>

  <!-- ===================================================================== -->
  <!-- CENTER GRADIENT BAR: CORE APPLICATION                                 -->
  <!-- ===================================================================== -->
  <g transform="translate(115, 296)">
    <rect width="970" height="66" rx="12" fill="url(#coreGrad)" filter="url(#barShadow)"/>
    <text x="105" y="41" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="23" font-weight="800" fill="#ffffff" letter-spacing="0.8">
      GRC BUNDLE REVIEWER
    </text>
    <line x1="415" y1="33" x2="495" y2="33" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.7"/>
    <text x="515" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16.5" font-weight="500" fill="#ffffff">
      Python 3.11 – Bash CLI – Docker Air-Gap – Debian Bookworm
    </text>
  </g>

  <!-- ===================================================================== -->
  <!-- MIDDLE BIDIRECTIONAL ARROWS                                           -->
  <!-- ===================================================================== -->
  <!-- Left Middle Pair -->
  <line x1="305" y1="362" x2="305" y2="402" stroke="#00a8e8" stroke-width="2.5" stroke-dasharray="6,3" marker-end="url(#arrowCyan)"/>
  <line x1="322" y1="408" x2="322" y2="368" stroke="#f97316" stroke-width="2.5" stroke-dasharray="6,3" marker-end="url(#arrowOrange)"/>

  <!-- Right Middle Pair -->
  <line x1="875" y1="362" x2="875" y2="402" stroke="#00a8e8" stroke-width="2.5" stroke-dasharray="6,3" marker-end="url(#arrowCyan)"/>
  <line x1="892" y1="408" x2="892" y2="368" stroke="#10b981" stroke-width="2.5" stroke-dasharray="6,3" marker-end="url(#arrowGreen)"/>

  <!-- ===================================================================== -->
  <!-- MIDDLE ROW: ISOLATION RUNTIME & PHASE 4 COMPLIANCE SYNTHESIS          -->
  <!-- ===================================================================== -->
  <!-- Left Middle Card: Container Isolation & Ingestion Gateway -->
  <g transform="translate(185, 412)">
    <rect width="285" height="90" rx="12" fill="#ffffff" filter="url(#cardShadow)"/>
    <circle cx="46" cy="45" r="26" fill="#9b87c7"/>
    <!-- Twin Gears Icon -->
    <circle cx="40" cy="40" r="7" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-dasharray="4,2"/>
    <circle cx="52" cy="51" r="6" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="3,2"/>
    <circle cx="40" cy="40" r="2.5" fill="#ffffff"/>
    <circle cx="52" cy="51" r="2" fill="#ffffff"/>
    <text x="84" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#374151">Isolation &amp; Ingestion</text>
    <text x="84" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" fill="#4b5563">--network none • /workspace:ro</text>
    <text x="84" y="73" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" fill="#6b7280">grc_bundle.py • grc_ami.py (0444)</text>
  </g>

  <!-- Right Middle Card: Phase 4 SCR/SCN & Compliance Reporting -->
  <g transform="translate(730, 412)">
    <rect width="310" height="90" rx="12" fill="#ffffff" filter="url(#cardShadow)"/>
    <circle cx="46" cy="45" r="26" fill="#22c55e"/>
    <!-- Dashboard & Compliance Document Icon -->
    <rect x="33" y="33" width="26" height="22" rx="2.5" fill="none" stroke="#ffffff" stroke-width="2"/>
    <line x1="37" y1="40" x2="48" y2="40" stroke="#ffffff" stroke-width="2"/>
    <line x1="37" y1="45" x2="54" y2="45" stroke="#ffffff" stroke-width="2"/>
    <line x1="37" y1="50" x2="45" y2="50" stroke="#ffffff" stroke-width="2"/>
    <circle cx="53" cy="39" r="2.5" fill="#ffffff"/>
    <text x="84" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#374151">SCR/SCN &amp; POA&amp;M Engine</text>
    <text x="84" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" fill="#4b5563">poam_data.md • controls.md</text>
    <text x="84" y="73" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" fill="#6b7280">NIST 800-53 R5 • FedRAMP • SHA-256</text>
  </g>

  <!-- ===================================================================== -->
  <!-- ORTHOGONAL BRANCHING CONNECTOR TO BOTTOM ROW                          -->
  <!-- ===================================================================== -->
  <line x1="327" y1="502" x2="327" y2="532" stroke="#334155" stroke-width="2.2"/>
  <line x1="885" y1="502" x2="885" y2="532" stroke="#334155" stroke-width="2.2"/>
  <line x1="270" y1="532" x2="885" y2="532" stroke="#334155" stroke-width="2.2"/>
  <line x1="270" y1="532" x2="270" y2="556" stroke="#334155" stroke-width="2.2" marker-end="url(#arrowSlate)"/>
  <line x1="775" y1="532" x2="775" y2="556" stroke="#334155" stroke-width="2.2" marker-end="url(#arrowSlate)"/>

  <!-- ===================================================================== -->
  <!-- BOTTOM ROW: APPLE SILICON WORKSTATION & GIT / GITHUB ECOSYSTEM        -->
  <!-- ===================================================================== -->

  <!-- Bottom-Left Card: Workstation Hardware, OS & IDE -->
  <g transform="translate(115, 562)">
    <rect width="335" height="106" rx="14" fill="#ffffff" filter="url(#cardShadow)"/>
    <!-- Blue Hexagon Badge -->
    <polygon points="52,24 76,38 76,66 52,80 28,66 28,38" fill="#00a8e8"/>
    <!-- Desktop / MacBook Monitor Icon -->
    <rect x="38" y="40" width="28" height="18" rx="2" fill="none" stroke="#ffffff" stroke-width="2.2"/>
    <line x1="46" y1="63" x2="58" y2="63" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="52" y1="58" x2="52" y2="63" stroke="#ffffff" stroke-width="2.2"/>
    <text x="94" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="800" fill="#1f2937">WORKSTATION</text>
    <text x="94" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#374151">MacBook Pro – Apple Silicon M5 Pro</text>
    <text x="94" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" fill="#4b5563">macOS ARM64 – Docker Desktop</text>
    <text x="94" y="93" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#00a8e8">Google Antigravity IDE • Zsh • jq</text>
  </g>

  <!-- Bottom-Right Dashed Container: Local Git & GitHub Repositories -->
  <rect x="505" y="562" width="585" height="106" rx="14" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Sub-Card 1: Local Git & Release Bundles -->
  <g transform="translate(522, 575)">
    <rect width="265" height="80" rx="10" fill="#ffffff" filter="url(#cardShadow)"/>
    <!-- Blue Hexagon Badge -->
    <polygon points="42,15 62,26 62,50 42,61 22,50 22,26" fill="#00a8e8"/>
    <!-- Git Branch / Bundle Icon -->
    <circle cx="36" cy="30" r="3" fill="none" stroke="#ffffff" stroke-width="2"/>
    <circle cx="36" cy="46" r="3" fill="none" stroke="#ffffff" stroke-width="2"/>
    <circle cx="49" cy="36" r="3" fill="none" stroke="#ffffff" stroke-width="2"/>
    <path d="M36 33 V43 M36 38 C42 38 49 38 49 39" fill="none" stroke="#ffffff" stroke-width="2"/>
    <text x="76" y="37" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15.5" font-weight="800" fill="#1f2937">Local Git <tspan font-weight="500" fill="#4b5563">- v2.30+</tspan></text>
    <text x="76" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#6b7280">.bundle Verify &amp; Clone</text>
  </g>

  <!-- Sub-Card 2: GitHub Cloud & Test Dummies -->
  <g transform="translate(808, 575)">
    <rect width="265" height="80" rx="10" fill="#ffffff" filter="url(#cardShadow)"/>
    <!-- Blue Hexagon Badge -->
    <polygon points="42,15 62,26 62,50 42,61 22,50 22,26" fill="#00a8e8"/>
    <!-- Repository / Cloud Octo Node Icon -->
    <path d="M33 44 C33 36 37 31 42 31 C47 31 51 36 51 44" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <circle cx="42" cy="37" r="4" fill="#ffffff"/>
    <path d="M35 47 H49" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
    <text x="76" y="37" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15.5" font-weight="800" fill="#1f2937">GitHub <tspan font-weight="500" fill="#4b5563">- Repos</tspan></text>
    <text x="76" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#6b7280">grc-bundle-review &amp; dummies</text>
  </g>

  <!-- ===================================================================== -->
  <!-- FOOTER BAR                                                            -->
  <!-- ===================================================================== -->
  <text x="75" y="712" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#6b7280" letter-spacing="0.8">
    GRC<tspan fill="#00a8e8">PIPELINE</tspan>
  </text>
  <line x1="175" y1="708" x2="575" y2="708" stroke="#00a8e8" stroke-width="1" stroke-opacity="0.5"/>
  <circle cx="600" cy="708" r="10" fill="#00a8e8"/>
  <text x="600" y="712" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#ffffff">1</text>
  <line x1="625" y1="708" x2="985" y2="708" stroke="#00a8e8" stroke-width="1" stroke-opacity="0.5"/>
  <text x="1125" y="712" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#00a8e8" letter-spacing="0.5">
    EODARTINTLABS-HUE
  </text>
</svg>
